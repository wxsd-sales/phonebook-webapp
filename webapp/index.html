<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Phonebook Web App</title>
    <!-- Generated from project.config.json by scripts/apply-config.mjs. -->
    <script src="app-config.js"></script>
    <link rel="stylesheet" href="phonebook.css" />
    <link rel="icon" href="../wizard/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="phone">
      <header class="phone-header">
        <button
          class="phone-icon-button"
          id="phone-back"
          type="button"
          aria-label="Back"
          hidden
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M15 5 7 12l8 7"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <h1 class="phone-title" id="phone-title">Directory</h1>
      </header>

      <div class="phone-card">
        <p class="phone-prompt" id="phone-prompt"></p>
        <p class="phone-status" id="phone-status"></p>

        <ul
          class="phone-list"
          id="phone-list"
          role="list"
          aria-label="Directory entries"
        ></ul>

        <div class="phone-card-footer">
          <button class="phone-pill" id="phone-exit" type="button">Exit</button>
        </div>
      </div>
    </div>

    <!--
      Shared confirm/edit/dialing modal, styled after the RoomOS SIP
      protocol-handler dial-confirmation prompt. "Call" (row action) shows
      the name/number read-only; "Edit dial" shows an editable input
      instead. Tapping the modal's own Call button starts dialing, which
      swaps the Call button for "Dialing..." text and hides the back button.
    -->
    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <div class="modal-card">
        <button
          class="modal-back"
          id="modal-back"
          type="button"
          aria-label="Back"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M15 5 7 12l8 7"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <div class="modal-info" id="modal-info">
          <p class="modal-name" id="modal-name"></p>
          <p class="modal-number" id="modal-number"></p>
        </div>

        <input
          class="modal-input"
          id="modal-input"
          type="tel"
          inputmode="tel"
          autocomplete="off"
          hidden
        />
        <p class="modal-input-value" id="modal-input-value" hidden></p>

        <button class="modal-call" id="modal-call" type="button">Call</button>
        <p class="modal-dialing" id="modal-dialing" hidden>Dialing…</p>
      </div>
    </div>

    <script type="module" src="phonebook.js"></script>
    <script type="module">
      const config = window.APP_CONFIG ?? {};
      if (config.title) {
        document.title = config.title;
      }
    </script>
  </body>
</html>
