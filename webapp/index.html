<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Phonebook Web App</title>
    <!-- Generated from project.config.json by scripts/apply-config.mjs. -->
    <script src="app-config.js"></script>
    <link rel="stylesheet" href="phonebook.css" />
    <link rel="icon" href="../wizard/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="phone">
      <header class="phone-titlebar">
        <h1 class="phone-title" id="phone-title">Directory</h1>
        <p class="phone-prompt" id="phone-prompt"></p>
      </header>

      <p class="phone-status" id="phone-status"></p>

      <ul
        class="phone-list"
        id="phone-list"
        role="listbox"
        aria-label="Directory entries"
      ></ul>

      <div class="phone-softkeys">
        <button class="phone-softkey" id="softkey-back" type="button">
          Back
        </button>
        <button
          class="phone-softkey phone-softkey--primary"
          id="softkey-editdial"
          type="button"
        >
          Edit Dial
        </button>
        <button
          class="phone-softkey phone-softkey--primary"
          id="softkey-dial"
          type="button"
        >
          Dial
        </button>
      </div>
    </div>

    <section class="phone-edit" id="phone-edit" hidden>
      <h2 class="phone-edit-title">Edit Number</h2>
      <div class="phone-edit-body">
        <label class="phone-edit-label" for="phone-edit-input"
          >Number to dial</label
        >
        <input
          class="phone-edit-input"
          id="phone-edit-input"
          type="tel"
          inputmode="tel"
          autocomplete="off"
        />
      </div>
      <div class="phone-softkeys">
        <button class="phone-softkey" id="phone-edit-cancel" type="button">
          Cancel
        </button>
        <button
          class="phone-softkey phone-softkey--primary"
          id="phone-edit-confirm"
          type="button"
        >
          Dial
        </button>
      </div>
    </section>

    <section class="phone-dialing" id="phone-dialing" hidden>
      <div class="phone-dialing__number" id="phone-dialing-number"></div>
      <div class="phone-dialing__label">Dialing…</div>
    </section>

    <script type="module" src="phonebook.js"></script>
    <script type="module">
      const config = window.APP_CONFIG ?? {};
      if (config.title) {
        document.title = config.title;
      }
    </script>
  </body>
</html>
