name: Update Screenshots

on:
  push:
    branches: [main]
    paths:
      - "wizard/**"
      - "webapp/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: chrome
        with:
          chrome-version: stable
      - name: Capture screenshots
        run: npm run screenshots
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - name: Commit updated screenshots
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "chore: update screenshots"
            git push
          else
            echo "No screenshot changes to commit."
          fi
