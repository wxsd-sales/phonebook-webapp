name: Update Screenshots

on:
  push:
    branches: [main]
    paths:
      - "wizard/**"
      - "webapp/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: stable
      - name: Capture screenshots
        run: npm run screenshots
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - name: Commit updated screenshots
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "chore: update screenshots"
            git push
          else
            echo "No screenshot changes to commit."
          fi
